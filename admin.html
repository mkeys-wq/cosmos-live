<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>COSMOS · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0B0D14; --bg-elev: #12141d; --text: #F2ECE0;
  --muted: rgba(242,236,224,0.55); --corona: #E8975E; --danger: #E88060;
  --hairline: rgba(255,255,255,0.08); --hairline-bright: rgba(255,255,255,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; padding: 60px 24px; min-height: 100vh; }
.wrap { max-width: 900px; margin: 0 auto; }
.eyebrow { color: var(--corona); font-size: 0.7rem; letter-spacing: 0.24em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--corona); }
h1 { font-family: 'Chakra Petch', sans-serif; font-weight: 500; font-size: clamp(2rem, 5vw, 3rem); text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 16px; }
h1 em { font-style: italic; color: var(--corona); font-weight: 700; }
.intro { color: var(--muted); font-size: 0.9rem; line-height: 1.6; max-width: 60ch; margin-bottom: 40px; }
.intro a { color: var(--corona); text-decoration: none; }
.intro a:hover { text-decoration: underline; }
.auth { padding: 24px; background: var(--bg-elev); border: 1px solid var(--hairline); border-left: 3px solid var(--corona); margin-bottom: 40px; }
.auth label { display: block; margin-bottom: 10px; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
input, button { font-family: 'Space Mono', monospace; font-size: 0.85rem; padding: 12px 16px; border: 1px solid var(--hairline-bright); background: transparent; color: var(--text); }
input { width: 100%; margin-bottom: 16px; }
input:focus { outline: none; border-color: var(--corona); }
button { cursor: pointer; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; transition: all 0.2s; }
button:hover { border-color: var(--corona); color: var(--corona); }
.btn-primary { background: var(--corona); color: var(--bg); border-color: var(--corona); }
.btn-primary:hover { background: transparent; color: var(--corona); }
.btn-danger { color: var(--danger); border-color: rgba(232,128,96,0.35); font-size: 0.65rem; padding: 8px 14px; }
.btn-danger:hover { border-color: var(--danger); background: rgba(232,128,96,0.1); color: var(--danger); }
.btn-ghost { color: var(--muted); border-color: var(--hairline); margin-left: 8px; }
.msg { padding: 14px 18px; margin: 16px 0; background: rgba(232,151,94,0.08); border-left: 3px solid var(--corona); font-size: 0.85rem; color: var(--text); }
.msg.error { background: rgba(232,128,96,0.12); border-left-color: var(--danger); }
.list-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--hairline); }
.list-head h2 { font-family: 'Chakra Petch', sans-serif; font-weight: 500; font-size: 1.2rem; text-transform: uppercase; letter-spacing: -0.005em; }
.list-head span { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; }
.testimonials { display: flex; flex-direction: column; gap: 10px; }
.testimonial { padding: 20px; background: var(--bg-elev); border: 1px solid var(--hairline); display: grid; grid-template-columns: 50px 1fr auto; gap: 20px; align-items: center; }
.testimonial-id { color: var(--corona); font-weight: 700; font-size: 1rem; }
.testimonial-meta { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.testimonial-story { font-size: 0.9rem; line-height: 1.55; color: var(--text); }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--hairline); font-size: 0.85rem; }
@media (max-width: 640px) { body { padding: 40px 16px; } .testimonial { grid-template-columns: 1fr; gap: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">COSMOS · Painel restrito</span>
  <h1>Gestão de <em>testemunhos</em></h1>
  <p class="intro">Ferramenta para apagar testemunhos submetidos. O token de admin fica guardado localmente neste browser. <a href="/">← Voltar ao site</a></p>

  <div class="auth">
    <label for="token">Token de admin</label>
    <input type="password" id="token" placeholder="Cola aqui o ADMIN_TOKEN definido no Render" autocomplete="off"/>
    <button class="btn-primary" onclick="loadList()">Entrar e carregar</button>
    <button class="btn-ghost" onclick="clearToken()">Esquecer token</button>
  </div>

  <div id="msg"></div>

  <div id="listContainer" hidden>
    <div class="list-head">
      <h2>Testemunhos</h2>
      <span id="counter">—</span>
    </div>
    <div class="testimonials" id="list"></div>
  </div>
</div>
