name: Daily data update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Fetch NASA APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/fetch-apod.mjs
        continue-on-error: true

      - name: Fetch Mars rover photos
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/fetch-mars-photos.mjs
        continue-on-error: true

      - name: Update mission live fields
        run: node scripts/update-missions.mjs
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config user.name "cosmos-bot"
          git config user.email "cosmos-bot@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "Nada mudou, sem commit"
          else
            git commit -m "chore(data): daily update $(date -u +%Y-%m-%d)"
            git push
          fi
