name: Weekly data update

# Segunda-feira às 06:00 UTC — as contagens de satélites não mudam rápido
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch satellite counts from Celestrak
        run: node scripts/fetch-satellites.mjs
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config user.name "cosmos-bot"
          git config user.email "cosmos-bot@users.noreply.github.com"
          git add data/satellites.json
          if git diff --staged --quiet; then
            echo "Nada mudou, sem commit"
          else
            git commit -m "chore(data): weekly satellite update $(date -u +%Y-%m-%d)"
            git push
          fi
